<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AUTOMATER-E2E</title>
<style>
  body { margin: 0; font-family: -apple-system, Helvetica; background: #f4f5f7; }
  #bar { padding: 8px 14px; background: #1d4ed8; color: #fff; font-size: 13px; }
  #zones { display: flex; height: 70vh; gap: 12px; padding: 12px; box-sizing: border-box; }
  .zone { flex: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
          font-size: 20px; font-weight: 600; user-select: none; }
  #single { background: #dbeafe; }
  #double { background: #fee2e2; }
  #keyrow { padding: 0 12px 12px; display: flex; align-items: center; gap: 10px; }
  #kb { width: 320px; height: 34px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 0 10px; }
</style>
</head>
<body>
<div id="bar">Automater E2E target</div>
<div id="zones">
  <div id="single" class="zone" tabindex="0">SINGLE zone</div>
  <div id="double" class="zone" tabindex="0">DOUBLE zone</div>
</div>
<div id="keyrow">
  <input id="kb" placeholder="focus me for key tests">
</div>
<script>
window.__events = { clicks: [], dblclicks: 0, keys: [] };

document.addEventListener('click', (e) => {
  window.__events.clicks.push({
    x: e.clientX, y: e.clientY,
    t: performance.now(),
    zone: e.target.closest('.zone')?.id || null,
    detail: e.detail,
  });
});
document.addEventListener('dblclick', () => { window.__events.dblclicks++; });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'kb') window.__events.keys.push(e.key);
});

window.__reset = function () {
  window.__events = { clicks: [], dblclicks: 0, keys: [] };
};
window.__center = function (sel) {
  const r = document.querySelector(sel).getBoundingClientRect();
  const chromeTop = window.outerHeight - window.innerHeight;
  const chromeSide = (window.outerWidth - window.innerWidth) / 2;
  return {
    x: Math.round(window.screenX + chromeSide + r.x + r.width / 2),
    y: Math.round(window.screenY + chromeTop + r.y + r.height / 2),
    screenX: window.screenX, screenY: window.screenY,
    outerW: window.outerWidth, outerH: window.outerHeight,
    innerW: window.innerWidth, innerH: window.innerHeight,
  };
};
</script>
</body>
</html>
